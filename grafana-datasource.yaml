# Example of provisioning a Grafana data source as code, instead of
# clicking through the UI. The kube-prometheus-stack chart already
# provisions the Prometheus data source automatically -- this file is
# provided as a reference for adding additional data sources (e.g. Loki).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://monitoring-kube-prometheus-prometheus.monitoring:9090
    isDefault: true
    editable: true

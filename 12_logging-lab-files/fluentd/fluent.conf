# Tails the sample app's log file and forwards each line to Logstash
# over HTTP as JSON. This is the "forwarder" half of the
# forwarder/aggregator pattern covered in the lecture.

<source>
  @type tail
  path /var/log/app/app.log
  pos_file /var/log/app/app.log.pos
  tag app.logs
  <parse>
    @type regexp
    expression /^(?<time>\S+ \S+) (?<level>\w+) (?<message>.*)$/
    time_format %Y-%m-%dT%H:%M:%S
  </parse>
</source>

<match app.logs>
  @type http
  endpoint http://logstash:8080
  <format>
    @type json
  </format>
  <buffer>
    flush_interval 5s
    retry_max_times 5
  </buffer>
</match>

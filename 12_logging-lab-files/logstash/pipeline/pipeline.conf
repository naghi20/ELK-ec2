# Receives already-parsed JSON events from Fluentd over HTTP,
# adds a couple of enrichment fields, and writes to Elasticsearch.
input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => { "pipeline" => "fluentd-logstash-demo" }
  }
  date {
    match => ["time", "yyyy-MM-dd'T'HH:mm:ss"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-app-%{+YYYY.MM.dd}"
  }
}
